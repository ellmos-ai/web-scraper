name: Tests

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,test]" build

      - name: Code style check (ruff)
        run: |
          ruff check .

      - name: Python bytecode compilation check
        run: |
          python -m compileall -q .

      - name: Build package artifacts (sdist & wheel)
        run: |
          python -m build --sdist --wheel --outdir dist

      - name: Install built distribution
        run: |
          python -m pip install dist/*.whl

      - name: CLI preflight check
        run: |
          web-scraper --help
          python -m web_scraper --help
          python -c "import web_scraper; print('web_scraper version:', web_scraper.__version__)"

      - name: Run unit & contract tests
        run: |
          python -m pytest -ra -v