[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "web-scraper"
version = "0.1.1"
description = "Standalone web scraper / browser control (get, links, forms, headers, content extraction, screenshot). Extracted from the BACH system."
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [
    {name = "Lukas Geiger / ellmos / BACH Contributors"}
]
keywords = ["web-scraping", "content-extraction", "html", "crawler", "bach", "ellmos"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Operating System :: OS Independent",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
    "Topic :: Internet :: WWW/HTTP",
    "Topic :: Software Development :: Libraries :: Python Modules",
]

# Kern arbeitet mit der Standardbibliothek (urllib + html.parser/regex).
dependencies = []

[project.optional-dependencies]
http = ["requests>=2.28"]
parse = ["beautifulsoup4>=4.11"]
extract = ["trafilatura>=1.6", "beautifulsoup4>=4.11"]
screenshot = ["selenium>=4.10"]
all = [
    "requests>=2.28",
    "beautifulsoup4>=4.11",
    "trafilatura>=1.6",
    "selenium>=4.10",
]
dev = [
    "pytest>=7.0",
    "ruff",
]
test = [
    "pytest>=7.0",
    "ruff",
]

[project.urls]
Homepage = "https://github.com/ellmos-ai/web-scraper"
Repository = "https://github.com/ellmos-ai/web-scraper"
Documentation = "https://github.com/ellmos-ai/web-scraper#readme"
Issues = "https://github.com/ellmos-ai/web-scraper/issues"
Changelog = "https://github.com/ellmos-ai/web-scraper/blob/main/CHANGELOG.md"
Security = "https://github.com/ellmos-ai/web-scraper/blob/main/SECURITY.md"
"Parent Organization" = "https://github.com/ellmos-ai"
"Umbrella Ecosystem" = "https://github.com/open-bricks"

[project.scripts]
web-scraper = "web_scraper.core:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["web_scraper*"]

[tool.pytest.ini_options]
minversion = "7.0"
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra -v"

[tool.ruff]
target-version = "py310"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W"]
ignore = ["E501"]
